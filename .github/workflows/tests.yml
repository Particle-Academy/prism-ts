name: Tests

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        # 22 and 24 are the supported LTS lines; 26 is current. NODE 20 WAS
        # REMOVED because it reached end of life on 2026-04-30 -- testing against
        # an unsupported runtime proves a package works where nobody should run
        # it, and declaring engines >=20 told consumers otherwise.
        #
        # This is a change to DECLARED SUPPORT, not just to CI, so it belongs in
        # this package's next tag annotation as a breaking change.
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      # The probe tests are part of the suite, not a separate category, so the
      # corpus has to be here for `npm test` to mean anything.
      #
      # The alternative — letting those tests skip themselves when the loader is
      # absent — is the failure this whole project is about: a mechanism that is
      # correct and silently not running, reporting green.
      - name: Checkout prism-parity
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-parity
          path: .parity

      # The six satellite ports and the harness, checked out as SIBLINGS because
      # that is how agent-contract's two probes reach them -- they import the
      # built artifact of each, from outside its repo, which is the only thing
      # in this suite asserting the packages work TOGETHER.
      #
      # Those two tests failed here from 2026-09-01 (G-47) for the plain reason
      # that a single-repo checkout has no siblings. The tempting fix was to let
      # them skip when the siblings are absent; the comment above rejects that
      # for the corpus loader, and it is the same argument -- a skip would turn
      # the loudest check in the ecosystem into a silent one, in exactly the
      # environment where nobody is watching it.
      #
      # So CI supplies the siblings instead. PRISM_PORTS_ROOT points the probes
      # at them, the same seam PRISM_PARITY_ROOT already uses for the corpus.
      - name: Checkout the sibling ports
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-harness-ts
          path: .ports/prism-harness-ts
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-perplexity-ts
          path: .ports/prism-perplexity-ts
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-opentelemetry-ts
          path: .ports/prism-opentelemetry-ts
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-memory-ts
          path: .ports/prism-memory-ts
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-mcp-ts
          path: .ports/prism-mcp-ts
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-browser-ts
          path: .ports/prism-browser-ts
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-human-plus-ts
          path: .ports/prism-human-plus-ts

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Each sibling is BUILT, not just checked out. The probes import
      # dist/index.js -- a checkout alone would leave them missing and the
      # failure would read identically to not having checked them out at all.
      - name: Build the sibling ports
        run: |
          for port in .ports/*/; do
            echo "::group::${port}"
            (cd "${port}" && npm ci && npm run build)
            echo "::endgroup::"
          done

      - run: npm run build

      # AFTER npm ci, always. The loader is installed from a path with
      # --no-save, which leaves it extraneous — and any later npm install prunes
      # it. Installed first, it would simply not be here by the time vitest ran.
      - name: Install the conformance corpus
        run: npm install ./.parity/loaders/ts --no-save

      # ../.ports from agent/, which is <workspace>/.ports -- where the siblings
      # were checked out above. Without this the probes look for real siblings
      # of the repo, which do not exist on a CI runner.
      - run: npm test
        env:
          PRISM_PORTS_ROOT: ../.ports

  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # This job only reads files, so it keeps no token in .git/config for
      # the fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every direct dependency must be approved on the org allowlist and still
      # maintained. The list is fetched, never vendored, so there is no copy here
      # to drift. The release guard requires this workflow to have succeeded for
      # the tagged commit, so a failure here also stops a publish.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  release-notes:
    name: Release-notes check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The checker is vendored rather than fetched, because for a Composer
      # package the pre-tag run is the only control that can prevent publication
      # and it has to work from the tree being tagged, offline, without piping a
      # remote script into a shell. That buys a copy, and an unchecked copy is one
      # that has already drifted without telling anyone -- prism-parity found 38
      # of 111 hand-maintained copies stale. So it is diffed, not trusted.
      - name: Fetch the canonical checker
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .canonical
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .canonical
          PIN_DIR: .canonical/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: The vendored checker must match the canonical one
        run: |
          for pair in check.sh:check-release-notes.sh check.test.sh:check-release-notes.test.sh; do
            diff -u ".canonical/release-notes/${pair%%:*}" "tools/${pair##*:}" || {
              echo "::error::tools/${pair##*:} has drifted from the pinned canonical repository release-notes/${pair%%:*}. Change the canonical file and re-vendor it; do not patch the copy."
              exit 1
            }
          done
          echo "Both vendored files match the canonical checker."
          rm -rf .canonical

      # tools/check-release-notes.sh refuses a tag annotation that does not say
      # whether the release breaks anything. It runs in publish.yml's guard, and
      # a release manager runs it by hand before tagging.
      #
      # It is tested HERE because a guard nobody tried to defeat is the recurring
      # way one of these ends up checking nothing. The suite asserts both
      # directions, and its sharpest case is a note that discusses breakage in
      # prose while declaring nothing: a plain `grep -i breaking` passes that, and
      # three real annotations in this estate are exactly that shape.
      - name: tools/check-release-notes.sh must refuse what it claims to
        run: sh tools/check-release-notes.test.sh
