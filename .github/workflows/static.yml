name: Static analysis

# The TypeScript equivalents of the reference's Pint and PHPStan jobs, plus the
# packaging check that stands in for composer-require-checker: the published
# tarball must contain what it claims to and nothing it does not.

on:
  push:
    branches:
      - main
      - "*.x"
  pull_request:

permissions:
  contents: read

jobs:
  # EVERY job below installs dependencies, and an install executes code:
  # `npm ci` runs lifecycle scripts, pip runs a build backend. So this gate is a
  # dependency of each of them rather than a job running alongside — a check
  # that finishes after the install has already run is a report, not a gate.
  #
  # The list is fetched, never vendored, so there is no copy here to drift.
  third-party:
    name: Third-party dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job only reads files, so it keeps no token in .git/config for the
      # fetched checker to find.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  types:
    name: Types
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The typecheck covers tests/ as well as src/, and the probe test imports
      # the loader — so the corpus has to be here. Excluding tests/ from the
      # typecheck would have been the easier fix and the wrong one: the probe
      # test is the thing that decides whether the conformance table measures
      # anything, so it is the last code that should go unchecked.
      - name: Checkout prism-parity
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-parity
          path: .parity

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # After npm ci, always — a --no-save path install is extraneous and any
      # later npm install prunes it.
      - run: npm install ./.parity/loaders/ts --no-save

      - run: npm run typecheck

  package:
    name: Package contents
    runs-on: ubuntu-latest
    needs: third-party
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # The reference runs composer-require-checker so a declared dependency
      # list cannot drift from the symbols actually used. The npm equivalent of
      # that failure is a tarball missing its build output, or carrying the test
      # suite and the conformance runner into a consumer's node_modules.
      - name: The tarball carries dist and nothing it should not
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path);
            const has = (p) => files.some(f => f.startsWith(p));
            const problems = [];
            if (!has('dist/')) problems.push('dist/ is missing — the package would ship no build output');
            if (!files.includes('LICENSE')) problems.push('LICENSE is missing');
            for (const unwanted of ['tests/', 'conformance/', '.parity/', 'src/']) {
              if (has(unwanted)) problems.push(unwanted + ' should not ship to consumers');
            }
            if (problems.length) { console.error(problems.join('\n')); process.exit(1); }
            console.error('Tarball contents look right (' + files.length + ' files).');
          "

      # A dependency this package does not declare must not be reachable at
      # runtime. The slice has ZERO runtime dependencies on purpose.
      - name: No runtime dependencies crept in
        run: |
          node -e "
            const deps = Object.keys(require('./package.json').dependencies ?? {});
            if (deps.length > 0) {
              console.error('Unexpected runtime dependencies - ' + deps.join(', '));
              process.exit(1);
            }
            console.error('Zero runtime dependencies, as declared.');
          "
